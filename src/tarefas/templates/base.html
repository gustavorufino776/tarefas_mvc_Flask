<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo_da_pagina }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Digite a tarefa e a data de conclusão (opcional):</h2>
 
    <form method="POST">
        <input type="text" id="tituloTarefa" name="tituloTarefa" placeholder="O que precisa ser feito?" value="{{ tarefa_edicao.titulo if tarefa_edicao else '' }}" required>
        <input type="date" id="dataConclusao" name="dataConclusao" value="{{ tarefa_edicao.data_conclusao if tarefa_edicao else '' }}">
        <button type="submit">{{ 'Atualizar' if tarefa_edicao else 'Adicionar' }}</button>
    </form>
   
    <ul id="listaTarefas">
        {% for tarefa in tarefas_da_pagina %}
            <li>
                <span>{{ tarefa.titulo_tarefa }} - {{ tarefa.data_conclusao }}</span>
                <div class="acoes-tarefa">
                    <a href="{{ url_for('editar_tarefa', id=tarefa.id_tarefa) }}">Editar</a>
                    <a href="{{ url_for('apagar_id_especificado', id=tarefa.id_tarefa) }}">Apagar</a>
                </div>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
